# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Prepare for static export
        run: |
          # Temporarily move server-dependent routes (not compatible with static export)
          # These routes require a Node.js server and won't work on GitHub Pages
          mkdir -p .server-routes-backup
          mv app/api .server-routes-backup/ || true
          mv app/editor .server-routes-backup/ || true
          mv app/upload .server-routes-backup/ || true
          mv app/generate .server-routes-backup/ || true
          mv app/sandbox .server-routes-backup/ || true

      - name: Build with Next.js
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Restore server routes
        run: |
          # Restore all moved routes
          mv .server-routes-backup/api app/ || true
          mv .server-routes-backup/editor app/ || true
          mv .server-routes-backup/upload app/ || true
          mv .server-routes-backup/generate app/ || true
          mv .server-routes-backup/sandbox app/ || true
          rm -rf .server-routes-backup

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
